name: Android debug
on:
  workflow_dispatch:
  push:
    branches: [codex/foundation-mobile-first]
    paths: ['mobile/**', 'android/**', 'app/**', 'lib/**', 'engine/**', 'content/**', 'package*.json', 'capacitor.config.ts', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm run android:sync
      - run: bash android/gradlew -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ascension-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
